name: Android build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: 选择操作；发布自动使用正式签名，未设置安装密码时为公开链接安装
        type: choice
        options:
          - 发布到蒲公英
          - 只构建正式 APK
          - 只构建内测 APK
        default: 发布到蒲公英

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    name: Client checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: node tool/verify.mjs

  build:
    name: Build arm64 APK
    # Keep build artifacts for diagnosis even when Client checks fail.
    # Publication is a separate job gated by both build and Client checks.
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      SIGNING_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.operation != '只构建内测 APK' && 'release' || 'preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install native build tools
        run: |
          JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}" \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Restore release keystore
        if: env.SIGNING_MODE == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Missing ANDROID_KEYSTORE_BASE64 secret')
          target = Path(os.environ['RUNNER_TEMP']) / 'yike-release.jks'
          target.write_bytes(base64.b64decode(''.join(value.split()), validate=True))
          target.chmod(0o600)
          PY
      - name: Build preview APK and archive symbols
        if: env.SIGNING_MODE == 'preview'
        run: node tool/build-android.mjs --preview --build-number "$GITHUB_RUN_NUMBER"
      - name: Build release APK and archive symbols
        if: env.SIGNING_MODE == 'release'
        env:
          YIKE_ANDROID_STORE_FILE: ${{ runner.temp }}/yike-release.jks
          YIKE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          YIKE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YIKE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tool/build-android.mjs --build-number "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yike-android-${{ env.SIGNING_MODE }}-${{ github.run_number }}
          path: build/releases/android/${{ env.SIGNING_MODE }}/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/yike-release.jks"

  publish:
    name: Publish to Pgyer
    needs: [verify, build]
    if: github.event_name == 'workflow_dispatch' && inputs.operation == '发布到蒲公英'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: yike-pgyer-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: yike-android-release-${{ github.run_number }}
          path: build/releases/android/release/
      - name: Upload APK and confirm publication
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          PGYER_INSTALL_PASSWORD: ${{ secrets.PGYER_INSTALL_PASSWORD }}
          PGYER_UPDATE_DESCRIPTION: Yike Android CI build ${{ github.run_number }} (${{ github.sha }})
        run: node tool/publish-pgyer.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yike-pgyer-publication-${{ github.run_number }}
          path: build/releases/android/release/pgyer-release.json
          if-no-files-found: error
          retention-days: 30
