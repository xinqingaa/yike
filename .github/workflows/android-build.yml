name: Client checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: 选择操作；发布自动使用正式签名，未设置安装密码时为公开链接安装
        type: choice
        options:
          - 发布到蒲公英
          - 只构建正式 APK
          - 只构建内测 APK
        default: 发布到蒲公英

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    name: Client checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine check scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess
          base = os.environ.get('DIFF_BASE', '')
          docs_only = False
          if os.environ['EVENT_NAME'] != 'workflow_dispatch' and base and set(base) != {'0'}:
              files = subprocess.check_output([
                  'git', 'diff', '--name-only', '-z', base, os.environ['DIFF_HEAD'],
              ]).decode().split('\0')
              files = [name for name in files if name]
              docs_only = bool(files) and all(name.endswith('.md') for name in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'docs_only={str(docs_only).lower()}\n')
          print('Documentation checks only' if docs_only else 'Full client checks')
          PYTHON
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check documentation
        if: steps.scope.outputs.docs_only == 'true'
        run: node tool/check-docs.mjs
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.scope.outputs.docs_only != 'true'
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: node tool/verify.mjs
        if: steps.scope.outputs.docs_only != 'true'

  build:
    name: Build arm64 APK
    if: github.event_name == 'workflow_dispatch'
    # Keep build artifacts for diagnosis even when Client checks fail.
    # Publication is a separate job gated by both build and Client checks.
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      SIGNING_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.operation != '只构建内测 APK' && 'release' || 'preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Install native build tools
        run: |
          JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}" \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Restore release keystore
        if: env.SIGNING_MODE == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Missing ANDROID_KEYSTORE_BASE64 secret')
          target = Path(os.environ['RUNNER_TEMP']) / 'yike-release.jks'
          target.write_bytes(base64.b64decode(''.join(value.split()), validate=True))
          target.chmod(0o600)
          PY
      - name: Build preview APK and archive symbols
        if: env.SIGNING_MODE == 'preview'
        run: node tool/build-android.mjs --preview --build-number "$GITHUB_RUN_NUMBER"
      - name: Build release APK and archive symbols
        if: env.SIGNING_MODE == 'release'
        env:
          YIKE_ANDROID_STORE_FILE: ${{ runner.temp }}/yike-release.jks
          YIKE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          YIKE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YIKE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tool/build-android.mjs --build-number "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yike-android-${{ env.SIGNING_MODE }}-${{ github.run_number }}
          path: build/releases/android/${{ env.SIGNING_MODE }}/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/yike-release.jks"

  publish:
    name: Publish to Pgyer
    needs: [verify, build]
    if: github.event_name == 'workflow_dispatch' && inputs.operation == '发布到蒲公英'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: yike-pgyer-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yike-android-release-${{ github.run_number }}
          path: build/releases/android/release/
      - name: Upload APK and confirm publication
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          PGYER_INSTALL_PASSWORD: ${{ secrets.PGYER_INSTALL_PASSWORD }}
          PGYER_UPDATE_DESCRIPTION: Yike Android CI build ${{ github.run_number }} (${{ github.sha }})
        run: node tool/publish-pgyer.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yike-pgyer-publication-${{ github.run_number }}
          path: build/releases/android/release/pgyer-release.json
          if-no-files-found: error
          retention-days: 30
