name: yike
description: "Yike Flutter target generated from flutter_pb_app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: ^3.47.8

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: 4.1.7
  audio_session: 0.2.4
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  mmkv: ^2.4.3
  pull_to_refresh_flutter3: ^2.0.2
  unified_popups: 2.2.1
  flutter_screenutil: ^5.9.3
  flutter_local_notifications: 22.3.2
  timezone: 0.11.2
  flutter_timezone: 5.1.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.12.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - asset/yike/sound/
    - asset/yike/artwork/
    - asset/yike/brand/mark.png
    - asset/yike/brand/mark-dark.png
    - asset/base/icons/
    - asset/yike/icons/
