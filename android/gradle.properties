org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# Yike uses PCM WAV effects; omit unused Opus/Ogg/Vorbis/FLAC native libraries.
NO_XIPH_LIBS=true
# Explicit so Flutter's migrator does not force the legacy Kotlin plugin back on.
android.builtInKotlin=true
# Flutter's Gradle plugin still casts the legacy application extension.
# AGP 9 warns that this opt-out is deprecated; setting it true fails configuration.
android.newDsl=false
